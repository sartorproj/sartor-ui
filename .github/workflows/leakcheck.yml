name: Leak Check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Leak Check Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  leakcheck:
    name: Leak Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Secrets are not passed to pull requests from forks; the scan then
      # warns and runs only the generic checks.
      - name: Write denylist
        env:
          LEAKCHECK_DENYLIST: ${{ secrets.LEAKCHECK_DENYLIST || vars.LEAKCHECK_DENYLIST }}
        run: |
          umask 077
          printf '%s\n' "$LEAKCHECK_DENYLIST" > .leakcheck-denylist

      # Base, head, branch, PR title and body come from $GITHUB_EVENT_PATH.
      - name: Scan
        run: python3 .github/scripts/leakcheck.py

      - name: Remove denylist
        if: always()
        run: rm -f .leakcheck-denylist
